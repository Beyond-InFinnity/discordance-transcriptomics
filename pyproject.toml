[project]
name = "discordance-transcriptomics"
version = "0.1.0"
description = "Molecular vascular/metabolic architecture of BOLD/CMRO2 discordance"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = [".venv", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "N803",    # `X`/`n` are conventional in statistical code
    "N806",
    "B905",    # zip(strict=) noise in numeric code
]

[tool.ruff.lint.per-file-ignores]
# Scripts insert the repo root on sys.path before importing src/, so their
# imports are necessarily below that statement.
"scripts/*" = ["E402"]
"tests/*" = ["N802", "N806"]
# Figure labels intentionally use Greek and typographic characters — ρ, Δ,
# CMRO₂, π. Rewriting them as ASCII would degrade the axis text that readers
# actually see, so the ambiguous-character rules are off for the viz layer only.
"src/viz/*" = ["RUF001", "RUF002", "RUF003"]
# Same for the report printer: it writes rho, Delta and pi to the terminal.
"scripts/p0_dynamic_range.py" = ["E402", "RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # abagen 0.1.4 imports pkg_resources; pinned setuptools<81 keeps it working.
    "ignore:pkg_resources is deprecated:UserWarning",
]

[tool.pytest]
